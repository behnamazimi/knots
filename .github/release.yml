changelog:
  exclude:
    authors:
      - github-actions[bot]
  categories:
    - title: New Features
      labels:
        - feat
        - feature
        - enhancement
    - title: Improvements
      labels:
        - improvement
        - perf
        - refactor
        - chore
        - docs
    - title: Bug Fixes
      labels:
        - fix
        - bug
    - title: Other Changes
      labels:
        - "*"
