name: Android Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web production assets
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: pnpm build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/knots-release.jks
          fi

      - name: Build Android APKs
        working-directory: android
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Generate Release Notes (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            let prevTag = "";
            try {
              prevTag = execSync("git describe --tags --abbrev=0 HEAD^", { encoding: "utf8" }).trim();
            } catch {}
            const range = prevTag ? `${prevTag}..HEAD` : "HEAD";
            const raw = execSync(`git log ${range} --no-merges --pretty=format:%s`, { encoding: "utf8" });
            const features = [], fixes = [], improvements = [];
            for (const line of raw.split(/\r?\n/)) {
              const s = line.trim();
              if (!s || s.startsWith("Tie the latest stargazer knots")) continue;
              const m = s.match(/^([a-zA-Z]+)(?:\([^)]*\))?:\s*(.+)$/);
              if (m) {
                const type = m[1].toLowerCase();
                const msg = m[2].charAt(0).toUpperCase() + m[2].slice(1);
                if (type === "feat") features.push(`- ${msg}`);
                else if (type === "fix") fixes.push(`- ${msg}`);
                else improvements.push(`- ${msg}`);
              } else {
                improvements.push(`- ${s}`);
              }
            }
            const out = [];
            if (features.length) out.push("### New Features", ...features, "");
            if (improvements.length) out.push("### Improvements", ...improvements, "");
            if (fixes.length) out.push("### Bug Fixes", ...fixes, "");
            if (!out.length) out.push("### Improvements", "- Bug fixes and performance improvements");
            fs.writeFileSync("release-notes.md", out.join("\n"));
          '

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
          body_path: release-notes.md
          draft: false
          prerelease: false
