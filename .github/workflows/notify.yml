# Tells the DevOps Telegram chat how main and production are doing: every failure and every pass
# of CI and of the production deploy. Pull request runs are left out: the author already sees them.
# So are the stargazers workflow's own commits ("Tie the latest stargazer knots").
# Needs repository secrets TELEGRAM_OPS_BOT_TOKEN and TELEGRAM_OPS_CHAT_ID (the same bot as lobyas).
name: Notify

on:
  workflow_run:
    workflows: [CI, Deploy]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  telegram:
    runs-on: ubuntu-latest
    if: >-
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
      && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
      && !startsWith(github.event.workflow_run.head_commit.message, 'Tie the latest stargazer knots')
    steps:
      - uses: actions/checkout@v7
      - name: Build the message
        id: message
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_TITLE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          title="$(printf '%s' "$COMMIT_TITLE" | head -n 1)"
          detail="${WORKFLOW} · ${SHA:0:7} ${title}"

          if [ "$CONCLUSION" = "failure" ]; then
            failed="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')"
            text="❌ ${WORKFLOW} failed${failed:+ (${failed})}"$'\n'"${detail}"$'\n'"${RUN_URL}"
          elif [ "$WORKFLOW" = "Deploy" ]; then
            text="🚀 Production deployed"$'\n'"${detail}"$'\n'"${RUN_URL}"
          else
            text="✅ ${WORKFLOW} passed"$'\n'"${detail}"$'\n'"${RUN_URL}"
          fi

          {
            echo "text<<EOF_MESSAGE"
            echo "$text"
            echo "EOF_MESSAGE"
          } >> "$GITHUB_OUTPUT"
      - name: Send to Telegram
        if: steps.message.outputs.text != ''
        env:
          TELEGRAM_OPS_BOT_TOKEN: ${{ secrets.TELEGRAM_OPS_BOT_TOKEN }}
          TELEGRAM_OPS_CHAT_ID: ${{ secrets.TELEGRAM_OPS_CHAT_ID }}
          MESSAGE: ${{ steps.message.outputs.text }}
        run: scripts/notify-telegram.sh
